[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tui-chat"
version = "0.1.0"
description = "Terminal chat client that bridges email (and more) into a single TUI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.58",
    "aioimaplib>=1.0.1",
    "aiosmtplib>=3.0.0",
    "platformdirs>=4.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
]

[project.scripts]
tui-chat = "tui_chat.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tui_chat"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
