# Copy to ~/.config/tui-chat/config.toml and fill in your details.
# Run `tui-chat` (no config) to try the built-in demo mode first.

[general]
# Where the local message cache lives.
# cache = "~/.local/share/tui-chat/messages.db"


# --- Real-time chat over XMPP (recommended) ---------------------------------
# Your friend uses any XMPP client (Conversations, Gajim, Swift); only your
# side runs in the terminal.
[[account]]
adapter = "xmpp"
name = "me"
address = "you@example.org"          # your JID
# host = "example.org"               # optional; DNS SRV is used if omitted
# port = 5222
password_env = "TUI_CHAT_XMPP_PASSWORD"

[[friend]]
adapter = "xmpp"
name = "Alice"
address = "alice@example.org"        # your friend's JID


